name: CV education map tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/education_locations.yml"
      - "_includes/cv/education.liquid"
      - "_includes/cv/china_education_map.svg"
      - "_pages/cv.md"
      - "_sass/_cv.scss"
      - "tests/test_cv_education_map.py"
      - ".github/workflows/cv-education-map-tests.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/education_locations.yml"
      - "_includes/cv/education.liquid"
      - "_includes/cv/china_education_map.svg"
      - "_pages/cv.md"
      - "_sass/_cv.scss"
      - "tests/test_cv_education_map.py"
      - ".github/workflows/cv-education-map-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pyyaml
      - name: Run tests
        run: python -m unittest discover -s tests
